<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" style="background: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: bold; fill: #ffffff; }
      .subtitle { font-size: 12px; fill: #999; }
      .layer-title { font-size: 14px; font-weight: 600; fill: #e0e0e0; }
      .tool-box { fill: #2d3748; stroke: #4a5568; stroke-width: 1.5; rx: 6; }
      .tool-box-highlight { fill: #2c5282; stroke: #63b3ed; stroke-width: 1.5; rx: 6; }
      .feature-box { fill: #1e3a2f; stroke: #2d5a47; stroke-width: 1.5; rx: 6; }
      .tool-text { font-size: 11px; font-weight: 600; fill: #e2e8f0; }
      .tool-sub { font-size: 9px; fill: #a0aec0; }
      .feature-text { font-size: 10px; fill: #9ae6b4; }
      .arrow-control { stroke: #63b3ed; stroke-width: 1.5; fill: none; marker-end: url(#arrow-blue); }
      .arrow-feature { stroke: #48bb78; stroke-width: 1; fill: none; marker-end: url(#arrow-green); stroke-dasharray: 3,2; }
      .group-rect { fill: none; stroke: #4a5568; stroke-width: 1; stroke-dasharray: 6,3; rx: 8; }
    </style>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#63b3ed" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#48bb78" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="28" text-anchor="middle" class="title">Polly Architecture: Tools � Features</text>
  <text x="600" y="46" text-anchor="middle" class="subtitle">Critical tools and the features they serve</text>

  <!-- Query flow (left column) -->
  <text x="24" y="75" class="layer-title">Query flow</text>
  <rect x="20" y="82" width="200" height="32" class="tool-box-highlight"/>
  <text x="120" y="98" text-anchor="middle" class="tool-text">Polly.query()</text>
  <text x="120" y="108" text-anchor="middle" class="tool-sub">core/polly.py</text>

  <path d="M 120 114 L 120 140" class="arrow-control"/>
  <rect x="20" y="140" width="200" height="220" class="group-rect"/>
  <text x="120" y="158" text-anchor="middle" class="layer-title">Critical tools</text>

  <rect x="32" y="168" width="176" height="36" class="tool-box"/>
  <text x="120" y="183" text-anchor="middle" class="tool-text">DomainEngine</text>
  <text x="120" y="193" text-anchor="middle" class="tool-sub">core/domains.py</text>

  <rect x="32" y="212" width="176" height="36" class="tool-box"/>
  <text x="120" y="227" text-anchor="middle" class="tool-text">UnifiedRAG</text>
  <text x="120" y="237" text-anchor="middle" class="tool-sub">core/rag.py</text>

  <rect x="32" y="256" width="176" height="36" class="tool-box"/>
  <text x="120" y="271" text-anchor="middle" class="tool-text">PatternEngine</text>
  <text x="120" y="281" text-anchor="middle" class="tool-sub">core/patterns/</text>

  <rect x="32" y="300" width="176" height="36" class="tool-box"/>
  <text x="120" y="315" text-anchor="middle" class="tool-text">MentalModelManager</text>
  <text x="120" y="325" text-anchor="middle" class="tool-sub">core/mental_models.py</text>

  <rect x="32" y="344" width="176" height="36" class="tool-box"/>
  <text x="120" y="359" text-anchor="middle" class="tool-text">EntityContextBuilder</text>
  <text x="120" y="369" text-anchor="middle" class="tool-sub">core/entities/context.py</text>

  <rect x="32" y="388" width="176" height="36" class="tool-box"/>
  <text x="120" y="403" text-anchor="middle" class="tool-text">CompressionManager</text>
  <text x="120" y="413" text-anchor="middle" class="tool-sub">core/compression/</text>

  <rect x="32" y="432" width="176" height="36" class="tool-box"/>
  <text x="120" y="447" text-anchor="middle" class="tool-text">IntelligentRouterV2</text>
  <text x="120" y="457" text-anchor="middle" class="tool-sub">core/router_v2.py</text>

  <rect x="32" y="476" width="176" height="36" class="tool-box"/>
  <text x="120" y="491" text-anchor="middle" class="tool-text">PersonaManager</text>
  <text x="120" y="501" text-anchor="middle" class="tool-sub">core/personas/manager.py</text>

  <rect x="32" y="520" width="176" height="36" class="tool-box"/>
  <text x="120" y="535" text-anchor="middle" class="tool-text">KnowledgeWriter</text>
  <text x="120" y="545" text-anchor="middle" class="tool-sub">core/knowledge_writer.py</text>

  <rect x="32" y="564" width="176" height="36" class="tool-box"/>
  <text x="120" y="579" text-anchor="middle" class="tool-text">AutonomyMetrics</text>
  <text x="120" y="589" text-anchor="middle" class="tool-sub">core/autonomy_metrics.py</text>

  <!-- Features (right side) -->
  <text x="380" y="75" class="layer-title">Features</text>
  <rect x="260" y="82" width="920" height="520" class="group-rect"/>
  <text x="720" y="100" text-anchor="middle" class="subtitle">Tools contribute to features (dashed green). Query flow uses tools (solid blue).</text>

  <rect x="280" y="118" width="160" height="44" class="feature-box"/>
  <text x="360" y="138" text-anchor="middle" class="feature-text">Chat &amp; query</text>
  <text x="360" y="152" text-anchor="middle" class="tool-sub">Streaming response</text>

  <rect x="460" y="118" width="160" height="44" class="feature-box"/>
  <text x="540" y="138" text-anchor="middle" class="feature-text">Personas &amp; modes</text>
  <text x="540" y="152" text-anchor="middle" class="tool-sub">Architect, Scribe, Professor</text>

  <rect x="640" y="118" width="160" height="44" class="feature-box"/>
  <text x="720" y="138" text-anchor="middle" class="feature-text">RAG &amp; retrieval</text>
  <text x="720" y="152" text-anchor="middle" class="tool-sub">Hybrid search, compression</text>

  <rect x="820" y="118" width="160" height="44" class="feature-box"/>
  <text x="900" y="138" text-anchor="middle" class="feature-text">Pattern learning</text>
  <text x="900" y="152" text-anchor="middle" class="tool-sub">Query�chunk, routing</text>

  <rect x="1000" y="118" width="160" height="44" class="feature-box"/>
  <text x="1080" y="138" text-anchor="middle" class="feature-text">Mental models</text>
  <text x="1080" y="152" text-anchor="middle" class="tool-sub">Activation, prompt injection</text>

  <rect x="280" y="178" width="160" height="44" class="feature-box"/>
  <text x="360" y="198" text-anchor="middle" class="feature-text">Domains</text>
  <text x="360" y="212" text-anchor="middle" class="tool-sub">Detection, weighting</text>

  <rect x="460" y="178" width="160" height="44" class="feature-box"/>
  <text x="540" y="198" text-anchor="middle" class="feature-text">Notes &amp; KB</text>
  <text x="540" y="212" text-anchor="middle" class="tool-sub">Save from chat, index</text>

  <rect x="640" y="178" width="160" height="44" class="feature-box"/>
  <text x="720" y="198" text-anchor="middle" class="feature-text">Curriculum &amp; teaching</text>
  <text x="720" y="212" text-anchor="middle" class="tool-sub">Curricula, Professor</text>

  <rect x="820" y="178" width="160" height="44" class="feature-box"/>
  <text x="900" y="198" text-anchor="middle" class="feature-text">Routing &amp; cost</text>
  <text x="900" y="212" text-anchor="middle" class="tool-sub">Tiers, budget, providers</text>

  <rect x="1000" y="178" width="160" height="44" class="feature-box"/>
  <text x="1080" y="198" text-anchor="middle" class="feature-text">Autonomy &amp; dashboard</text>
  <text x="1080" y="212" text-anchor="middle" class="tool-sub">Writes, routing stats</text>

  <!-- Tool � Feature links (dashed green) -->
  <path d="M 196 186 L 340 140" class="arrow-feature"/>
  <path d="M 196 230 L 700 140" class="arrow-feature"/>
  <path d="M 196 274 L 700 140" class="arrow-feature"/>
  <path d="M 196 274 L 880 140" class="arrow-feature"/>
  <path d="M 196 318 L 1060 140" class="arrow-feature"/>
  <path d="M 196 362 L 340 140" class="arrow-feature"/>
  <path d="M 196 406 L 340 140" class="arrow-feature"/>
  <path d="M 196 450 L 880 200" class="arrow-feature"/>
  <path d="M 196 494 L 520 140" class="arrow-feature"/>
  <path d="M 196 538 L 520 200" class="arrow-feature"/>
  <path d="M 196 582 L 1060 200" class="arrow-feature"/>

  <path d="M 196 186 L 340 200" class="arrow-feature"/>
  <path d="M 196 230 L 700 200" class="arrow-feature"/>
  <path d="M 196 450 L 700 140" class="arrow-feature"/>
  <path d="M 196 538 L 700 200" class="arrow-feature"/>

  <!-- Legend -->
  <rect x="260" y="620" width="400" height="100" class="group-rect"/>
  <text x="460" y="642" text-anchor="middle" class="layer-title">Tool � Feature (summary)</text>
  <text x="280" y="662" class="tool-sub">DomainEngine � Domains</text>
  <text x="280" y="678" class="tool-sub">UnifiedRAG + PatternEngine � RAG &amp; retrieval</text>
  <text x="280" y="694" class="tool-sub">PatternEngine � Pattern learning</text>
  <text x="280" y="710" class="tool-sub">MentalModelManager � Mental models</text>
  <text x="520" y="662" class="tool-sub">EntityContextBuilder, CompressionManager � Chat &amp; query</text>
  <text x="520" y="678" class="tool-sub">IntelligentRouterV2 � Routing &amp; cost</text>
  <text x="520" y="694" class="tool-sub">PersonaManager � Personas &amp; modes</text>
  <text x="520" y="710" class="tool-sub">KnowledgeWriter � Notes &amp; KB � AutonomyMetrics � Autonomy</text>

  <!-- Data stores -->
  <text x="260" y="755" class="layer-title">Data stores (tools use these)</text>
  <rect x="260" y="762" width="280" height="28" class="tool-box"/>
  <text x="400" y="778" text-anchor="middle" class="tool-text">entities.db � usage.db � ChromaDB � ~/.polly/ (patterns, mental_models, domains)</text>
  <rect x="560" y="762" width="620" height="28" class="feature-box"/>
  <text x="870" y="778" text-anchor="middle" class="feature-text">EntityStore, AutonomyMetrics, UnifiedRAG, PatternEngine, MentalModelManager, DomainEngine</text>

  <!-- Integration contracts -->
  <text x="260" y="818" class="layer-title">Integration contracts (core/protocols/)</text>
  <rect x="260" y="825" width="920" height="52" class="group-rect"/>
  <text x="280" y="845" class="tool-sub">ContextContributor (priority 60�10): MentalModelManager, EntityContextBuilder, PatternEngine, CompressionManager � _gather_context</text>
  <text x="280" y="862" class="tool-sub">PersonaAware: PatternEngine, EntityContextBuilder, MentalModelManager � set_active_persona � PatternConsumer: Router records ROUTING_OUTCOME via Polly</text>
</svg>
