<!DOCTYPE html>

            <text x="700" y="855" text-anchor="middle" class="layer-title">Core Architectural Principles</text>
            
            <text x="80" y="885" class="principle-text"><tspan class="principle-label">Edge-First:</tspan> Local models + selective cloud for privacy and speed</text>
            <text x="80" y="905" class="principle-text"><tspan class="principle-label">Hybrid Intelligence:</tspan> Semantic vectors + keyword search + learned patterns</text>
            <text x="80" y="925" class="principle-text"><tspan class="principle-label">Cost-Aware Routing:</tspan> Three-tier system optimizes quality vs. cost</text>
            <text x="80" y="945" class="principle-text"><tspan class="principle-label">Continuous Learning:</tspan> Pattern learner improves over time from usage</text>
            <text x="80" y="965" class="principle-text"><tspan class="principle-label">Domain-Driven:</tspan> Five domains organize knowledge with context-specific activation</text>
            
            <text x="750" y="885" class="principle-text"><tspan class="principle-label">Background Init:</tspan> Non-blocking startup via threading</text>
            <text x="750" y="905" class="principle-text"><tspan class="principle-label">Data Autonomy:</tspan> All data stored locally, full ownership</text>
            <text x="750" y="925" class="principle-text"><tspan class="principle-label">Compression-First:</tspan> 50x compression enables long context</text>
            <text x="750" y="945" class="principle-text"><tspan class="principle-label">Personal System:</tspan> Designed for individual workflow, not product</text>
            <text x="750" y="965" class="principle-text"><tspan class="principle-label">Philosophy-Driven:</tspan> Infinite games, continuation over completion</text>
