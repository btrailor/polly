<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" style="background: #1e1e1e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: bold; fill: #ffffff; }
      .subtitle { font-size: 14px; fill: #cccccc; }
      .layer-title { font-size: 16px; font-weight: 600; fill: #ffffff; }
      .component { fill: #2d2d2d; stroke: #4a4a4a; stroke-width: 2; rx: 8; }
      .component-highlight { fill: #3a3a3a; stroke: #6a9fb5; stroke-width: 2; rx: 8; }
      .component-text { font-size: 13px; font-weight: 600; fill: #ffffff; }
      .component-subtext { font-size: 10px; fill: #aaaaaa; }
      .arrow { stroke: #6a9fb5; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-data { stroke: #8b7fb5; stroke-width: 2; fill: none; marker-end: url(#arrowhead-data); stroke-dasharray: 4,4; }
      .group-box { fill: none; stroke: #444444; stroke-width: 1; stroke-dasharray: 8,4; rx: 12; }
      .domain-text { font-size: 11px; fill: #ff6b6b; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6a9fb5" />
    </marker>
    <marker id="arrowhead-data" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#8b7fb5" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="700" y="35" text-anchor="middle" class="title">Polly Architecture Overview</text>
  <text x="700" y="55" text-anchor="middle" class="subtitle">Personal AI System with Five-Domain Knowledge Management</text>

  <!-- Layer 1: User Interfaces -->
  <text x="50" y="100" class="layer-title">User Interfaces</text>
  <rect x="50" y="110" width="180" height="70" class="component"/>
  <text x="140" y="135" text-anchor="middle" class="component-text">Electron App</text>
  <text x="140" y="150" text-anchor="middle" class="component-subtext">Vanilla JS + CodeMirror</text>
  <text x="140" y="165" text-anchor="middle" class="component-subtext">Chat UI, Floating Chat</text>

  <rect x="250" y="110" width="180" height="70" class="component"/>
  <text x="340" y="135" text-anchor="middle" class="component-text">CLI Interface</text>
  <text x="340" y="150" text-anchor="middle" class="component-subtext">__main__.py</text>
  <text x="340" y="165" text-anchor="middle" class="component-subtext">Interactive shell</text>

  <rect x="450" y="110" width="180" height="70" class="component"/>
  <text x="540" y="135" text-anchor="middle" class="component-text">Web API</text>
  <text x="540" y="150" text-anchor="middle" class="component-subtext">REST endpoints</text>
  <text x="540" y="165" text-anchor="middle" class="component-subtext">External integrations</text>

  <!-- Layer 2: API Layer -->
  <text x="50" y="220" class="layer-title">API Layer</text>
  <rect x="50" y="230" width="580" height="70" class="component-highlight"/>
  <text x="340" y="255" text-anchor="middle" class="component-text">FastAPI Server (interfaces/server.py)</text>
  <text x="340" y="270" text-anchor="middle" class="component-subtext">Background initialization • WebSocket support • Session management</text>
  <text x="340" y="285" text-anchor="middle" class="component-subtext">/query • /mental-models • /personas • /notes • /collections</text>

  <!-- Arrows from UI to API -->
  <path d="M 140 180 L 140 230" class="arrow"/>
  <path d="M 340 180 L 340 230" class="arrow"/>
  <path d="M 540 180 L 540 230" class="arrow"/>

  <!-- Layer 3: Core Orchestration -->
  <text x="50" y="340" class="layer-title">Core Orchestration</text>
  <rect x="50" y="350" width="580" height="90" class="component-highlight"/>
  <text x="340" y="375" text-anchor="middle" class="component-text">Polly Core (core/polly.py - 1000+ lines)</text>
  <text x="340" y="395" text-anchor="middle" class="component-subtext">Main orchestrator • Query processing • Context assembly • Response generation</text>
  <text x="340" y="410" text-anchor="middle" class="component-subtext">Integrates: RAG + Router + Mental Models + Personas + Compression</text>
  <text x="340" y="425" text-anchor="middle" class="component-subtext">Background thread initialization pattern</text>

  <!-- Arrow from API to Core -->
  <path d="M 340 300 L 340 350" class="arrow"/>

  <!-- Layer 4: Intelligence Layer -->
  <text x="50" y="480" class="layer-title">Intelligence Layer</text>
  
  <!-- Five Domains Box -->
  <rect x="700" y="110" width="650" height="140" class="group-box"/>
  <text x="1025" y="130" text-anchor="middle" class="layer-title">Five-Domain System (core/domains.py)</text>
  
  <rect x="720" y="145" width="110" height="50" class="component"/>
  <text x="775" y="163" text-anchor="middle" class="domain-text">SIGILS</text>
  <text x="775" y="178" text-anchor="middle" class="component-subtext">Code</text>
  <text x="775" y="190" text-anchor="middle" class="component-subtext">Technical</text>

  <rect x="845" y="145" width="110" height="50" class="component"/>
  <text x="900" y="163" text-anchor="middle" class="domain-text">SIGNALS</text>
  <text x="900" y="178" text-anchor="middle" class="component-subtext">Audio</text>
  <text x="900" y="190" text-anchor="middle" class="component-subtext">Transcripts</text>

  <rect x="970" y="145" width="110" height="50" class="component"/>
  <text x="1025" y="163" text-anchor="middle" class="domain-text">SCROLLS</text>
  <text x="1025" y="178" text-anchor="middle" class="component-subtext">Writing</text>
  <text x="1025" y="190" text-anchor="middle" class="component-subtext">Documents</text>

  <rect x="1095" y="145" width="110" height="50" class="component"/>
  <text x="1150" y="163" text-anchor="middle" class="domain-text">GLYPHS</text>
  <text x="1150" y="178" text-anchor="middle" class="component-subtext">Design</text>
  <text x="1150" y="190" text-anchor="middle" class="component-subtext">Visual</text>

  <rect x="1220" y="145" width="110" height="50" class="component"/>
  <text x="1275" y="163" text-anchor="middle" class="domain-text">GRIDS</text>
  <text x="1275" y="178" text-anchor="middle" class="component-subtext">Systems</text>
  <text x="1275" y="190" text-anchor="middle" class="component-subtext">Thinking</text>

  <text x="1025" y="225" text-anchor="middle" class="component-subtext">Automatic domain detection • Multi-domain query support • Domain-specific context weighting</text>

  <!-- Mental Models -->
  <rect x="700" y="270" width="300" height="85" class="component"/>
  <text x="850" y="295" text-anchor="middle" class="component-text">Mental Models System</text>
  <text x="850" y="310" text-anchor="middle" class="component-subtext">core/mental_models.py</text>
  <text x="850" y="325" text-anchor="middle" class="component-subtext">12 default models • PIL compression</text>
  <text x="850" y="340" text-anchor="middle" class="component-subtext">3-tier activation: Domain + Page + Persona</text>

  <!-- Personas -->
  <rect x="1020" y="270" width="330" height="85" class="component"/>
  <text x="1185" y="295" text-anchor="middle" class="component-text">Personas & Modes System</text>
  <text x="1185" y="310" text-anchor="middle" class="component-subtext">core/personas.py</text>
  <text x="1185" y="325" text-anchor="middle" class="component-subtext">Context-aware personas • Mode switching</text>
  <text x="1185" y="340" text-anchor="middle" class="component-subtext">Task detection • Tone adaptation</text>

  <!-- RAG System -->
  <rect x="50" y="500" width="280" height="130" class="component-highlight"/>
  <text x="190" y="525" text-anchor="middle" class="component-text">Unified RAG System</text>
  <text x="190" y="540" text-anchor="middle" class="component-subtext">core/rag.py</text>
  <text x="190" y="558" text-anchor="middle" class="component-subtext">• Hybrid: Semantic + BM25 keyword</text>
  <text x="190" y="573" text-anchor="middle" class="component-subtext">• Pattern-based boosting</text>
  <text x="190" y="588" text-anchor="middle" class="component-subtext">• Query expansion</text>
  <text x="190" y="603" text-anchor="middle" class="component-subtext">• Multi-source: Obsidian, code, docs</text>
  <text x="190" y="618" text-anchor="middle" class="component-subtext">• Collection weighting by patterns</text>

  <!-- Router -->
  <rect x="350" y="500" width="280" height="130" class="component-highlight"/>
  <text x="490" y="525" text-anchor="middle" class="component-text">Intelligent Router v2</text>
  <text x="490" y="540" text-anchor="middle" class="component-subtext">core/router_v2.py</text>
  <text x="490" y="558" text-anchor="middle" class="component-subtext">• 3 tiers: Fast / Balanced / Thorough</text>
  <text x="490" y="573" text-anchor="middle" class="component-subtext">• Cost-aware routing</text>
  <text x="490" y="588" text-anchor="middle" class="component-subtext">• Multi-provider: Claude, GPT, GitHub</text>
  <text x="490" y="603" text-anchor="middle" class="component-subtext">• Hybrid local/cloud</text>
  <text x="490" y="618" text-anchor="middle" class="component-subtext">• Ollama for strong RAG context</text>

  <!-- Arrows from Core to Intelligence -->
  <path d="M 340 440 L 190 500" class="arrow"/>
  <path d="M 340 440 L 490 500" class="arrow"/>
  <path d="M 480 395 L 850 355" class="arrow"/>
  <path d="M 520 395 L 1185 355" class="arrow"/>
  <path d="M 400 350 L 1025 250" class="arrow"/>

  <!-- Layer 5: Learning & Optimization -->
  <text x="50" y="670" class="layer-title">Learning & Optimization</text>

  <rect x="50" y="680" width="280" height="110" class="component"/>
  <text x="190" y="705" text-anchor="middle" class="component-text">Pattern Learning System</text>
  <text x="190" y="720" text-anchor="middle" class="component-subtext">learners/patterns.py</text>
  <text x="190" y="738" text-anchor="middle" class="component-subtext">• Query→Chunk patterns</text>
  <text x="190" y="753" text-anchor="middle" class="component-subtext">• Domain→Collection patterns</text>
  <text x="190" y="768" text-anchor="middle" class="component-subtext">• Conceptual patterns</text>
  <text x="190" y="783" text-anchor="middle" class="component-subtext">• Learns from compressed conversations</text>

  <rect x="350" y="680" width="280" height="110" class="component"/>
  <text x="490" y="705" text-anchor="middle" class="component-text">Conversation Compression</text>
  <text x="490" y="720" text-anchor="middle" class="component-subtext">core/compression/compressor.py</text>
  <text x="490" y="738" text-anchor="middle" class="component-subtext">• 50x+ compression ratio</text>
  <text x="490" y="753" text-anchor="middle" class="component-subtext">• Feeds pattern learner</text>
  <text x="490" y="768" text-anchor="middle" class="component-subtext">• Reduces token costs</text>
  <text x="490" y="783" text-anchor="middle" class="component-subtext">• Maintains semantic meaning</text>

  <!-- Feedback arrows -->
  <path d="M 190 630 L 190 680" class="arrow-data"/>
  <path d="M 330 735 L 350 735" class="arrow-data"/>
  <path d="M 190 680 L 190 630" class="arrow-data"/>

  <!-- Layer 6: Data Sources -->
  <text x="700" y="400" class="layer-title">Knowledge Sources & Storage</text>

  <rect x="700" y="410" width="180" height="70" class="component"/>
  <text x="790" y="435" text-anchor="middle" class="component-text">ChromaDB</text>
  <text x="790" y="450" text-anchor="middle" class="component-subtext">Vector embeddings</text>
  <text x="790" y="465" text-anchor="middle" class="component-subtext">Collections per domain</text>

  <rect x="900" y="410" width="180" height="70" class="component"/>
  <text x="990" y="435" text-anchor="middle" class="component-text">Obsidian Vault</text>
  <text x="990" y="450" text-anchor="middle" class="component-subtext">Markdown notes</text>
  <text x="990" y="465" text-anchor="middle" class="component-subtext">Personal knowledge base</text>

  <rect x="1100" y="410" width="180" height="70" class="component"/>
  <text x="1190" y="435" text-anchor="middle" class="component-text">Codebases</text>
  <text x="1190" y="450" text-anchor="middle" class="component-subtext">GitHub repos</text>
  <text x="1190" y="465" text-anchor="middle" class="component-subtext">Local projects</text>

  <rect x="700" y="500" width="180" height="70" class="component"/>
  <text x="790" y="525" text-anchor="middle" class="component-text">Documents</text>
  <text x="790" y="540" text-anchor="middle" class="component-subtext">PDFs, text files</text>
  <text x="790" y="555" text-anchor="middle" class="component-subtext">Research papers</text>

  <rect x="900" y="500" width="180" height="70" class="component"/>
  <text x="990" y="525" text-anchor="middle" class="component-text">Pattern Database</text>
  <text x="990" y="540" text-anchor="middle" class="component-subtext">Learned patterns</text>
  <text x="990" y="555" text-anchor="middle" class="component-subtext">Query success history</text>

  <rect x="1100" y="500" width="180" height="70" class="component"/>
  <text x="1190" y="525" text-anchor="middle" class="component-text">Conversation History</text>
  <text x="1190" y="540" text-anchor="middle" class="component-subtext">Compressed logs</text>
  <text x="1190" y="555" text-anchor="middle" class="component-subtext">Session context</text>

  <!-- Arrows from RAG/Router to Data Sources -->
  <path d="M 330 565 L 700 445" class="arrow-data"/>
  <path d="M 330 565 L 900 445" class="arrow-data"/>
  <path d="M 330 565 L 1100 445" class="arrow-data"/>
  <path d="M 190 630 L 790 570" class="arrow-data"/>
  <path d="M 190 630 L 990 570" class="arrow-data"/>

  <!-- Layer 7: External AI Providers -->
  <text x="700" y="620" class="layer-title">AI Model Providers</text>

  <rect x="700" y="630" width="180" height="70" class="component"/>
  <text x="790" y="655" text-anchor="middle" class="component-text">Anthropic Claude</text>
  <text x="790" y="670" text-anchor="middle" class="component-subtext">Primary reasoning</text>
  <text x="790" y="685" text-anchor="middle" class="component-subtext">Complex queries</text>

  <rect x="900" y="630" width="180" height="70" class="component"/>
  <text x="990" y="655" text-anchor="middle" class="component-text">OpenAI GPT</text>
  <text x="990" y="670" text-anchor="middle" class="component-subtext">Alternative provider</text>
  <text x="990" y="685" text-anchor="middle" class="component-subtext">Fallback option</text>

  <rect x="1100" y="630" width="180" height="70" class="component"/>
  <text x="1190" y="655" text-anchor="middle" class="component-text">GitHub Models</text>
  <text x="1190" y="670" text-anchor="middle" class="component-subtext">Budget-friendly</text>
  <text x="1190" y="685" text-anchor="middle" class="component-subtext">Fast tier</text>

  <rect x="700" y="720" width="280" height="70" class="component"/>
  <text x="840" y="745" text-anchor="middle" class="component-text">Ollama (Local)</text>
  <text x="840" y="760" text-anchor="middle" class="component-subtext">Edge-first approach • Privacy • Low latency</text>
  <text x="840" y="775" text-anchor="middle" class="component-subtext">Used when RAG context is strong</text>

  <rect x="1000" y="720" width="280" height="70" class="component"/>
  <text x="1140" y="745" text-anchor="middle" class="component-text">spaCy NLP</text>
  <text x="1140" y="760" text-anchor="middle" class="component-subtext">Local language processing</text>
  <text x="1140" y="775" text-anchor="middle" class="component-subtext">Entity extraction • Query analysis</text>

  <!-- Arrows from Router to AI Providers -->
  <path d="M 560 630 L 700 665" class="arrow"/>
  <path d="M 580 630 L 900 665" class="arrow"/>
  <path d="M 600 630 L 1100 665" class="arrow"/>
  <path d="M 490 630 L 840 720" class="arrow"/>

  <!-- Key Principles Box -->
  <rect x="50" y="830" width="1300" height="150" class="group-box"/>
  <text x="700" y="855" text-anchor="middle" class="layer-title">Core Architectural Principles</text>
  
  <text x="80" y="885" class="component-subtext">• <tspan font-weight="600">Edge-First</tspan>: Local models + selective cloud usage for privacy &amp; speed</text>
  <text x="80" y="905" class="component-subtext">• <tspan font-weight="600">Hybrid Intelligence</tspan>: Semantic vectors + keyword search + learned patterns</text>
  <text x="80" y="925" class="component-subtext">• <tspan font-weight="600">Cost-Aware Routing</tspan>: Three-tier system optimizes quality vs. cost</text>
  <text x="80" y="945" class="component-subtext">• <tspan font-weight="600">Continuous Learning</tspan>: Pattern learner improves over time from usage</text>
  <text x="80" y="965" class="component-subtext">• <tspan font-weight="600">Domain-Driven</tspan>: Five domains organize knowledge with context-specific activation</text>
  
  <text x="750" y="885" class="component-subtext">• <tspan font-weight="600">Background Init</tspan>: Non-blocking startup via threading</text>
  <text x="750" y="905" class="component-subtext">• <tspan font-weight="600">Data Autonomy</tspan>: All data stored locally, full ownership</text>
  <text x="750" y="925" class="component-subtext">• <tspan font-weight="600">Compression-First</tspan>: 50x compression enables long context</text>
  <text x="750" y="945" class="component-subtext">• <tspan font-weight="600">Personal System</tspan>: Designed for individual workflow, not product</text>
  <text x="750" y="965" class="component-subtext">• <tspan font-weight="600">Philosophy-Driven</tspan>: Infinite games, continuation over completion</text>

</svg>