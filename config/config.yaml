user:
  name: User
knowledge_base:
  path: /Users/brettgershon/.polly
models:
  local:
    host: http://localhost:11434
    embedding_model: nomic-embed-text
    chat_models:
      fast: llama3.2:3b
      balanced: llama3.1:7b
      quality: llama3.1:70b
    default: balanced
  cloud:
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    models:
      default: claude-sonnet-4-20250514
      quality: claude-opus-4-20250514
      fast: claude-haiku
rag:
  vector_db_path: /Users/brettgershon/.polly/chroma_db
  chunk_size: 800
  chunk_overlap: 100
  n_results: 5
server:
  host: 0.0.0.0
  port: 11436
router:
  default_mode: auto
  allow_override: true
compression:
  enabled: true
  message_threshold: 20
  age_hours: 24
  keep_recent: 10
  show_stats: false
  strategy: auto
  rag_context:
    enabled: true
    ratio: 0.5
  conversation:
    strategy: llm_summary
  llmlingua:
    model: microsoft/llmlingua-2-bert-base-multilingual-cased-meetingbank
    device: cpu
routing_v2:
  enabled: true
  use_litellm: false
  budget:
    database_path: /Users/brettgershon/.polly/usage.db
    daily_limit: 10.0
    monthly_limit: 200.0
memory:
  provider: mem0
  mem0:
    enabled: true
    embedding_provider: ollama
    llm_provider: ollama
    vector_store: chroma
    graph_store: null
    
    providers:
      ollama:
        host: http://localhost:11434
        embedding_model: nomic-embed-text
        llm_model: llama3.2:3b
        temperature: 0.0
      
      qwen:
        api_key_env: DASHSCOPE_API_KEY
        embedding_model: text-embedding-v3
        llm_model: qwen-turbo
        temperature: 0.0
      
      minimax:
        api_key_env: MINIMAX_API_KEY
        group_id_env: MINIMAX_GROUP_ID
        embedding_model: embo-01
        llm_model: abab6.5s-chat
        temperature: 0.0
      
      glm:
        api_key_env: ZHIPUAI_API_KEY
        embedding_model: embedding-3
        llm_model: glm-4-flash
        temperature: 0.0
    
    collections:
      knowledge: polly_mem0_knowledge
      patterns: polly_mem0_patterns
      personas: polly_mem0_personas
deduplication:
  enabled: true
  similarity_threshold: 0.7
  max_results: 5
