user:
  name: User
knowledge_base:
  path: /Users/brettgershon/.polly
models:
  local:
    host: http://localhost:11434
    embedding_model: nomic-embed-text
    chat_models:
      fast: qwen2.5:7b
      balanced: qwen2.5:7b
      quality: qwen2.5:7b
    default: balanced
    context_windows:       # Approximate context window in tokens for each local tier
      fast: 32768          # qwen2.5:7b = 32K
      balanced: 32768
      quality: 32768
  cloud:
    provider: anthropic
    api_key_env: ANTHROPIC_API_KEY
    models:
      default: claude-sonnet-4-20250514
      quality: claude-opus-4-20250514
      fast: claude-haiku
rag:
  vector_db_path: /Users/brettgershon/.polly/chroma_db
  chunk_size: 800
  chunk_overlap: 100
  n_results: 5
  # Tier-aware retrieval limits — overrides n_results per routing tier
  tier_n_results:
    local_fast: 3        # Small context window: fewer chunks
    local_balanced: 5    # Standard
    cloud: 10            # Large context window: more chunks for better coverage
  # Tier-aware max context tokens passed to format_context()
  tier_max_context_tokens:
    local_fast: 2000
    local_balanced: 3000
    cloud: 6000
  # LLMLingua compression of RAG context before sending to local models
  rag_compression:
    enabled: true
    local_fast_ratio: 0.3     # 3x compression — tight 8K context
    local_balanced_ratio: 0.5 # 2x compression — 32K context
    cloud_ratio: 0.7          # Minimal — cloud has large context; keep quality
    min_chars: 1500           # Only compress contexts larger than this
  pattern_boost:
    enabled: true
    per_turn_reinforcement: true   # Reinforce on every turn (not just at compression)
    negative_patterns: true        # Track and apply miss penalties
    max_boost: 4.0                 # Hard ceiling on positive boost multiplier
    min_penalty: 0.5               # Floor on penalty multiplier
    positive_override_threshold: 5 # hit_count above which positive overrides negative
  retrieval_classifier:
    # Score threshold for DIRECT tier (note is a direct answer).
    # Lowered from 0.8 → 0.72 so Polly-written notes surface as DIRECT
    # rather than ADJACENT on closely-matching follow-up queries.
    direct_threshold: 0.72
    # Score threshold for ADJACENT tier (related but not a direct answer)
    adjacent_threshold: 0.5
    # Boost applied when a result's domain matches the query domain
    domain_match_boost: 0.1
    # Penalty for results from a different domain than the query
    cross_domain_penalty: 0.15
server:
  host: 0.0.0.0
  port: 11436
router:
  default_mode: auto
  allow_override: true
routing:
  decomposition:
    enabled: true
    model: fast  # fast/balanced/thorough - tier for decomposition LLM (using fast since decomposition is just JSON structuring)
    min_complexity_score: 0.6  # 0.0-1.0, threshold for decomposition
  split_routing:
    enabled: true
    prefer_local: true  # Prefer local routing when possible
    local_rag_threshold: 0.7  # RAG coverage threshold for local routing
    max_parallel_queries: 5  # Max parallel sub-queries
  synthesis:
    enabled: true
    use_llm: true  # Use LLM for synthesis vs simple concatenation
    prefer_local: true  # Use local model for synthesis when possible
    compression_threshold: 2000  # Apply LLMLingua compression above this char count
  wave5:
    enabled: false  # Wave 5: LlamaIndex KG + SubQuestionQueryEngine. Set true to activate.
    llamaindex:
      embedding_model: "nomic-embed-text"  # MUST match rag.embedding_model
      llm_tier: "fast"                     # fast/balanced/thorough for SubQuestionQueryEngine
      collections: ["notes", "codebase", "documents", "patterns"]
      kg_enabled: true                     # Include EntityStore-backed KG tool
compression:
  enabled: true
  message_threshold: 20
  age_hours: 24
  keep_recent: 10
  min_messages: 10           # Never compress below this count
  age_count_threshold: 10    # Min exchanges required for age-based trigger
  show_stats: false
  strategy: auto
  semantic_trigger:
    enabled: true
    min_messages: 12              # Minimum messages before semantic trigger fires
    redundancy_threshold: 0.15    # SRS below this → compress
    window_size: 6                # Messages in rolling average window
    log_srs: false                # Log SRS on each check (debug)
  rag_context:
    enabled: true
    ratio: 0.5
  conversation:
    strategy: llm_summary
  llmlingua:
    model: microsoft/llmlingua-2-bert-base-multilingual-cased-meetingbank
    device: cpu
semantic_cache:
  enabled: false  # Set to true to enable semantic caching
  similarity_threshold: 0.92  # Cosine similarity threshold for cache hit (0.0-1.0)
  max_entries: 500  # LRU eviction above this count
  ttl_hours: 24  # Entries older than this are stale
  exclude_personas: []  # Personas that should never be cached (e.g., "scribe")
  exclude_domains: []  # Domains that should never be cached
  min_response_tokens: 50  # Don't cache very short responses
context_budget:
  rolling:
    persist_across_sessions: true  # Persist RollingContext between sessions
    session_gap_turn_duration_secs: 30  # Assumed seconds per turn for gap decay
    max_persist_age_hours: 72  # Hard cutoff: entries older than this dropped
    min_score_after_decay: 0.05  # Drop entries that decay below this
    decay_per_turn: 0.85
    eviction_turns: 5
    amplification_reset: true
routing_v2:
  enabled: true
  use_litellm: true
  litellm_config_path: config/litellm_config.yaml
  budget:
    database_path: /Users/brettgershon/.polly/usage.db
    daily_limit: 10.0
    monthly_limit: 200.0
memory:
  provider: mem0
  mem0:
    enabled: true
    embedding_provider: ollama
    llm_provider: ollama
    vector_store: chroma
    graph_store: null
    
    providers:
      ollama:
        host: http://localhost:11434
        embedding_model: nomic-embed-text
        llm_model: qwen2.5:7b
        temperature: 0.0
      
      qwen:
        api_key_env: DASHSCOPE_API_KEY
        embedding_model: text-embedding-v3
        llm_model: qwen-turbo
        temperature: 0.0
      
      minimax:
        api_key_env: MINIMAX_API_KEY
        group_id_env: MINIMAX_GROUP_ID
        embedding_model: embo-01
        llm_model: abab6.5s-chat
        temperature: 0.0
      
      glm:
        api_key_env: ZHIPUAI_API_KEY
        embedding_model: embedding-3
        llm_model: glm-4-flash
        temperature: 0.0
    
    collections:
      knowledge: polly_mem0_knowledge
      patterns: polly_mem0_patterns
      personas: polly_mem0_personas
deduplication:
  enabled: true
  similarity_threshold: 0.7
  max_results: 5
nexus:
  enabled: false   # Phase 24a: Polly-native agent interface. Set true to activate.
  db_path: "~/.polly/swarms.db"
  single_agent_only: true  # Phase 24a only; multi-agent DAGs deferred to Phase 24b
  # Phase 24c: execution context policies (per-type access control for agents)
  contexts:
    filesystem:
      enabled: true
      read_only: true
      allowed_operations: ["read"]
    github:
      enabled: false
      allowed_operations: []
    obsidian:
      enabled: true
      allowed_operations: ["read", "write"]
    ghost_cms:
      enabled: false
      allowed_operations: []
    rag:
      enabled: true
      allowed_operations: ["query"]
    knowledge_graph:
      enabled: true
      allowed_operations: ["query"]
    email:
      enabled: false
      allowed_operations: []
    calendar:
      enabled: false
      allowed_operations: []
  # Phase 24e: user-defined prompt agents
  prompt_agents:
    enabled: true
