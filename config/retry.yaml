# Retry Policies — Hardened Knowledge Infrastructure
#
# Operation-specific retry configuration with exponential backoff,
# jitter, circuit breaker, and parameter adjustments per attempt.
#
# Each operation specifies:
#   max_attempts:      Maximum number of tries (1 = no retry)
#   initial_delay_ms:  Delay before first retry
#   backoff_multiplier: Delay multiplied by this each attempt
#   max_delay_ms:      Cap on delay
#   jitter:            Add ±25% randomness to prevent thundering herd
#   retry_on:          Error conditions that trigger retry
#   parameter_adjustments: Per-attempt parameter overrides
#   circuit_breaker:   (optional) Circuit breaker config

retry_policies:

  rag_retrieval:
    max_attempts: 3
    initial_delay_ms: 100
    backoff_multiplier: 2.0
    max_delay_ms: 2000
    jitter: true
    retry_on:
      - timeout
      - connection_error
      - embedding_service_unavailable
    parameter_adjustments:
      attempt_1:
        similarity_threshold: 0.8
        top_k: 5
      attempt_2:
        similarity_threshold: 0.6
        top_k: 10
      attempt_3:
        similarity_threshold: 0.4
        top_k: 20
        enable_fuzzy_match: true

  llm_generation:
    max_attempts: 3
    initial_delay_ms: 500
    backoff_multiplier: 1.5
    max_delay_ms: 5000
    jitter: true
    retry_on:
      - rate_limit
      - service_unavailable
      - timeout
    parameter_adjustments:
      attempt_1:
        temperature: 0.7
        max_tokens: 2048
      attempt_2:
        temperature: 0.5
        max_tokens: 1024
      attempt_3:
        temperature: 0.3
        max_tokens: 512
        fallback_to_local_model: true

  context_assembly:
    max_attempts: 2
    initial_delay_ms: 0
    backoff_multiplier: 1.0
    max_delay_ms: 0
    jitter: false
    retry_on:
      - context_too_large
    parameter_adjustments:
      attempt_1:
        max_context_tokens: 16000
        summarization: none
      attempt_2:
        max_context_tokens: 8000
        summarization: aggressive
        chunk_strategy: most_relevant_only

  external_api:
    max_attempts: 3
    initial_delay_ms: 1000
    backoff_multiplier: 2.0
    max_delay_ms: 10000
    jitter: true
    retry_on:
      - rate_limit
      - service_unavailable
      - timeout
      - connection_error
    circuit_breaker:
      failure_threshold: 5
      timeout_duration_s: 60
      half_open_requests: 1
