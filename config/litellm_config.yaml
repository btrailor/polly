custom_endpoints: null
fallback_chains:
  balanced:
  - github/openai/gpt-4o-mini
  - anthropic/claude-sonnet-4-20250514
  - openai/gpt-4-turbo
  - gemini/gemini-1.5-flash-latest
  fast:
  - github/openai/gpt-4o-mini
  - anthropic/claude-3-haiku-20240307
  - openai/gpt-3.5-turbo
  - gemini/gemini-1.5-flash-8b-latest
  thorough:
  - github/openai/gpt-4o
  - anthropic/claude-opus-4-20250514
  - openai/gpt-4o
  - gemini/gemini-1.5-pro-latest
model_mappings:
  claude-3-haiku-20240307: anthropic/claude-3-haiku-20240307
  claude-opus-4-20250514: anthropic/claude-opus-4-20250514
  claude-sonnet-4-20250514: anthropic/claude-sonnet-4-20250514
  gemini-1.5-flash: gemini/gemini-1.5-flash-latest
  gemini-1.5-flash-8b: gemini/gemini-1.5-flash-8b-latest
  gemini-1.5-pro: gemini/gemini-1.5-pro-latest
  gpt-3.5-turbo: openai/gpt-3.5-turbo
  gpt-4-turbo: openai/gpt-4-turbo
  gpt-4o: openai/gpt-4o
  gpt-4o-mini: openai/gpt-4o-mini
  grok-2-1212: xai/grok-2-1212
  llama-3.1-sonar-huge-128k-online: perplexity/llama-3.1-sonar-huge-128k-online
  llama-3.1-sonar-large-128k-online: perplexity/llama-3.1-sonar-large-128k-online
  llama-3.1-sonar-small-128k-online: perplexity/llama-3.1-sonar-small-128k-online
  mistral-large-latest: mistral/mistral-large-latest
  mistral-medium-latest: mistral/mistral-medium-latest
  mistral-small-latest: mistral/mistral-small-latest
  openai/gpt-4o: github/gpt-4o
  openai/gpt-4o-mini: github/gpt-4o-mini
  openrouter/anthropic/claude-3.5-sonnet: openrouter/anthropic/claude-3.5-sonnet
  openrouter/google/gemini-pro-1.5: openrouter/google/gemini-pro-1.5
  openrouter/openai/gpt-4o: openrouter/openai/gpt-4o
providers:
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
    enabled: true
    models:
    - capabilities:
      - chat
      - code
      - analysis
      context_length: 200000
      id: claude-3-haiku-20240307
      name: Claude 3 Haiku
    - capabilities:
      - chat
      - code
      - analysis
      - planning
      context_length: 200000
      id: claude-sonnet-4-20250514
      name: Claude Sonnet 4
    - capabilities:
      - chat
      - code
      - analysis
      - planning
      - reasoning
      context_length: 200000
      id: claude-opus-4-20250514
      name: Claude Opus 4
  gemini:
    api_key_env: GEMINI_API_KEY
    enabled: true
    models:
    - capabilities:
      - chat
      - code
      - vision
      context_length: 1000000
      id: gemini-1.5-flash-latest
      name: Gemini 1.5 Flash
    - capabilities:
      - chat
      - code
      context_length: 1000000
      id: gemini-1.5-flash-8b-latest
      name: Gemini 1.5 Flash 8B
    - capabilities:
      - chat
      - code
      - analysis
      - vision
      context_length: 2000000
      id: gemini-1.5-pro-latest
      name: Gemini 1.5 Pro
  github:
    api_key_env: GITHUB_TOKEN
    base_url: https://models.github.ai
    enabled: true
    models:
    - capabilities:
      - chat
      - code
      context_length: 128000
      id: openai/gpt-4o-mini
      name: GPT-4o Mini (via GitHub)
    - capabilities:
      - chat
      - code
      - analysis
      context_length: 128000
      id: openai/gpt-4o
      name: GPT-4o (via GitHub)
  grok:
    api_key_env: XAI_API_KEY
    enabled: false
    models:
    - capabilities:
      - chat
      - code
      - analysis
      - reasoning
      context_length: 131072
      id: grok-2-1212
      name: Grok 2
  mistral:
    api_key_env: MISTRAL_API_KEY
    enabled: true
    models:
    - capabilities:
      - chat
      - code
      context_length: 32000
      id: mistral-small-latest
      name: Mistral Small
    - capabilities:
      - chat
      - code
      - analysis
      context_length: 32000
      id: mistral-medium-latest
      name: Mistral Medium
    - capabilities:
      - chat
      - code
      - analysis
      - reasoning
      context_length: 32000
      id: mistral-large-latest
      name: Mistral Large
  openai:
    api_key_env: OPENAI_API_KEY
    enabled: true
    models:
    - capabilities:
      - chat
      - code
      context_length: 16385
      id: gpt-3.5-turbo
      name: GPT-3.5 Turbo
    - capabilities:
      - chat
      - code
      - analysis
      context_length: 128000
      id: gpt-4-turbo
      name: GPT-4 Turbo
    - capabilities:
      - chat
      - code
      - analysis
      - vision
      context_length: 128000
      id: gpt-4o
      name: GPT-4o
    - capabilities:
      - chat
      - code
      context_length: 128000
      id: gpt-4o-mini
      name: GPT-4o Mini
  openrouter:
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    enabled: true
    models:
    - capabilities:
      - chat
      - code
      - analysis
      context_length: 200000
      id: openrouter/anthropic/claude-3.5-sonnet
      name: Claude 3.5 Sonnet (via OpenRouter)
    - capabilities:
      - chat
      - code
      - analysis
      - vision
      context_length: 128000
      id: openrouter/openai/gpt-4o
      name: GPT-4o (via OpenRouter)
    - capabilities:
      - chat
      - code
      - analysis
      - vision
      context_length: 2000000
      id: openrouter/google/gemini-pro-1.5
      name: Gemini 1.5 Pro (via OpenRouter)
  perplexity:
    api_key_env: PERPLEXITY_API_KEY
    enabled: true
    models:
    - capabilities:
      - chat
      - search
      - online
      context_length: 127072
      id: llama-3.1-sonar-small-128k-online
      name: Sonar Small (Online)
    - capabilities:
      - chat
      - search
      - online
      - analysis
      context_length: 127072
      id: llama-3.1-sonar-large-128k-online
      name: Sonar Large (Online)
    - capabilities:
      - chat
      - search
      - online
      - analysis
      - reasoning
      context_length: 127072
      id: llama-3.1-sonar-huge-128k-online
      name: Sonar Huge (Online)
settings:
  cache_enabled: false
  cache_ttl: 3600
  debug: false
  enable_fallbacks: true
  max_retries: 2
  timeout: 60
