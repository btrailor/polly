[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polly-routing"
version = "0.1.0"
description = "Intelligent multi-provider routing library for AI applications"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Polly AI Team"}
]
keywords = ["ai", "llm", "routing", "multi-provider", "anthropic", "openai", "litellm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
litellm = [
    "litellm>=1.30.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]
all = [
    "polly-routing[litellm,dev]",
]

[project.urls]
Homepage = "https://github.com/polly-ai/polly"
Documentation = "https://github.com/polly-ai/polly#readme"
Repository = "https://github.com/polly-ai/polly"

[tool.setuptools.packages.find]
where = ["."]
include = ["polly_routing*"]

[tool.setuptools.package-data]
polly_routing = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
