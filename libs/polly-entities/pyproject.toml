[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polly-entities"
version = "0.1.0"
description = "Entity store, extractor, and context builder for Polly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
spacy = ["spacy>=3.7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["polly_entities*"]
