[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polly-patterns"
version = "0.1.0"
description = "Unified pattern engine for Polly (learn, search, storage backends)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
mem0 = ["mem0ai>=1.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["polly_patterns*"]
