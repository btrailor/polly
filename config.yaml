# Apollo Configuration
# Copy to config.yaml and customize for your setup

# Your identity (used in system prompts)
user:
  name: "Brett"

# Five Domains - customize paths for your setup
domains:
  sigils:
    name: "Sigils"
    description: "Code, infrastructure, automation"
    paths:
      - "~/Code"
      - "~/Infrastructure"
    patterns:
      - "*.py"
      - "*.rs"
      - "*.go"
      - "*.ts"
      - "*.lua"
      - "docker-compose*.yaml"
      - "Dockerfile*"
    keywords:
      - "docker"
      - "kubernetes"
      - "automation"
      - "infrastructure"

  signals:
    name: "Signals"
    description: "Audio programming, synthesis, DSP"
    paths:
      - "~/Code/norns"
      - "~/Code/supercollider"
      - "~/Music/Projects"
    patterns:
      - "*.scd"
      - "*.lua"
      - "*.maxpat"
    keywords:
      - "audio"
      - "midi"
      - "synthesis"
      - "dsp"
      - "norns"
      - "supercollider"

  scrolls:
    name: "Scrolls"
    description: "Writing, pedagogy, documentation"
    paths:
      - "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Vault"
      - "~/Writing"
    patterns:
      - "*.md"
      - "*.txt"
    keywords:
      - "essay"
      - "pedagogy"
      - "education"
      - "writing"
      - "notes"

  glyphs:
    name: "Glyphs"
    description: "Visual work, design, UI/UX"
    paths:
      - "~/Design"
      - "~/Projects/visual"
    patterns:
      - "*.fig"
      - "*.sketch"
      - "design/*.md"
    keywords:
      - "design"
      - "visual"
      - "ui"
      - "ux"

  grids:
    name: "Grids"
    description: "Systems thinking, mental models, frameworks"
    paths:
      - "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Vault/Glyphs"
      - "~/Frameworks"
    patterns:
      - "*.md"
    keywords:
      - "framework"
      - "mental model"
      - "systems"
      - "infinite game"
      - "constraint"

# Obsidian vault (primary knowledge source)
obsidian:
  vault_path: "/Users/brettgershon/Library/Mobile Documents/iCloud~md~obsidian/Documents/Organizer"
  # Metadata file for cross-device sync
  metadata_path: ".obsidian/apollo-metadata.json"

# Notes management (Phase 16)
notes:
  # Active source: "obsidian" or "native"
  source: "native"  # Changed to use native knowledge base by default
  
  # Obsidian vault configuration
  obsidian:
    vault_path: "/Users/brettgershon/Library/Mobile Documents/iCloud~md~obsidian/Documents/Organizer"
    enabled: true
  
  # Native Polly notes configuration
  native:
    path: "~/.polly/notes"
    enabled: true  # Enabled for native knowledge base use
  
  # File watcher for auto-indexing
  auto_index: true
  
  # Domain validation
  domain_validation: true

# Template system (Phase 16e)
templates:
  folder: ".polly/templates"  # Relative to vault root
  auto_reload: true           # Watch for template changes

# Codebase indexing
codebases:
  paths:
    - "~/Code"
  exclude:
    - "node_modules"
    - ".git"
    - "__pycache__"
    - "venv"
    - ".venv"
    - "target"
    - "build"
    - "dist"

# Model configuration
models:
  # Local models via Ollama
  local:
    host: "http://localhost:11434"
    embedding_model: "nomic-embed-text"
    chat_models:
      fast: "qwen2.5:7b"
      balanced: "qwen2.5:7b"
      quality: "qwen2.5:7b"  # If you have the VRAM
    default: "balanced"

  # Cloud models for complex queries or when local unavailable
  cloud:
    provider: "anthropic"  # or "openai", "openrouter"
    api_key_env: "ANTHROPIC_API_KEY"  # Environment variable name
    models:
      default: "claude-sonnet-4-20250514"
      quality: "claude-opus-4-20250514"
      fast: "claude-haiku"
    # When to use cloud
    triggers:
      - "complex multi-step reasoning"
      - "code review across files"
      - "synthesis across domains"
      - "long context needed"

# Intelligent routing (legacy v1 - for backward compatibility)
router:
  # Prefer local when:
  prefer_local:
    - "simple questions"
    - "code completion"
    - "quick lookups"
    - "pattern matching"
  # Prefer cloud when:
  prefer_cloud:
    - "complex reasoning"
    - "creative synthesis"
    - "multi-file analysis"
    - "long conversations"
  # Let user override
  allow_override: true
  # Default mode: "local", "cloud", "auto"
  default_mode: "auto"

# Multi-Provider Intelligent Routing (v2 - Phase 11)
routing_v2:
  # Enable new routing system
  enabled: true
  
  # Default confidence level: "fast", "balanced", "thorough"
  default_confidence: "balanced"
  
  # Provider configurations
  providers:
    anthropic:
      enabled: true
      api_key_env: "ANTHROPIC_API_KEY"  # Environment variable
      priority: 1  # Higher priority = preferred
      models:
        fast: "claude-3-haiku-20240307"
        balanced: "claude-sonnet-4-20250514"
        thorough: "claude-opus-4-20250514"
    
    openai:
      enabled: true
      api_key_env: "OPENAI_API_KEY"
      priority: 2
      models:
        fast: "gpt-3.5-turbo"
        balanced: "gpt-4-turbo"
        thorough: "gpt-4o"
    
    github:
      enabled: true  # GitHub Models integration (Phase 11b complete!)
      oauth_token_env: "GITHUB_TOKEN"
      priority: 1  # Primary provider (fastest + access to multiple models)
      models:
        fast: "openai/gpt-4o-mini"
        balanced: "openai/gpt-4o"
        thorough: "anthropic/claude-3.5-sonnet"
  
  # Three-tier routing configuration
  tiers:
    fast:
      max_cost_per_request: 0.01  # $0.01 max per request
      description: "Quick responses for simple queries"
      models:
        - provider: github
          model: openai/gpt-4o-mini
          priority: 1
        - provider: anthropic
          model: claude-3-haiku-20240307
          priority: 2
        - provider: openai
          model: gpt-3.5-turbo
          priority: 3
    
    balanced:
      max_cost_per_request: 0.10  # $0.10 max per request
      description: "Balance of quality and cost"
      models:
        - provider: github
          model: openai/gpt-4o
          priority: 1
        - provider: anthropic
          model: claude-sonnet-4-20250514
          priority: 2
        - provider: openai
          model: gpt-4-turbo
          priority: 3
    
    thorough:
      max_cost_per_request: 1.00  # $1.00 max per request
      description: "Maximum quality for complex tasks"
      models:
        - provider: github
          model: anthropic/claude-3.5-sonnet
          priority: 1
        - provider: anthropic
          model: claude-opus-4-20250514
          priority: 2
        - provider: openai
          model: gpt-4o
          priority: 3
        - provider: openai
          model: o1-preview
          priority: 4
  
  # Budget limits
  budget:
    daily_limit: 10.00       # $10 per day
    monthly_limit: 200.00    # $200 per month
    warn_at_percent: 80      # Warn at 80% usage
    database_path: "~/.polly/usage.db"
  
  # Complexity classification hints
  complexity:
    # High complexity indicators (score 7-10)
    high:
      - "architect|design system|refactor entire"
      - "multi-file|across files|whole codebase"
      - "complex|sophisticated|advanced"
      - "optimize|performance|scalability"
    
    # Medium complexity indicators (score 4-6)
    medium:
      - "implement|create|build"
      - "review|analyze|explain"
      - "debug|fix bug|troubleshoot"
      - "refactor|improve|enhance"
    
    # Low complexity indicators (score 1-3)
    low:
      - "what is|define|explain simple"
      - "quick|simple|basic"
      - "complete this|finish|autocomplete"
      - "fix typo|format|prettify"
  
  # Fallback behavior
  fallback:
    # Retry failed providers
    retry_on_error: true
    # Maximum retries per provider
    max_retries: 1
    # Enable automatic tier downgrade on budget constraints
    downgrade_on_budget: true

# Scalable Memory Layers (Tiered Memory + Context Budget)
memory:
  provider: "mem0"
  extraction:
    enabled: true
    cloud_threshold: "balanced"      # Session complexity that triggers cloud model
    cloud_model: "claude-haiku"
    local_model: "qwen2.5:7b"
    max_cloud_cost: 0.02             # Per-extraction budget cap
  tiers:
    stable:
      collection: "memory_stable"
      decay: null                    # No decay for stable facts
    episodic:
      collection: "memory_episodic"
      decay_halflife_days: 90        # Score halves every 90 days
    working:
      collection: "memory_working"
      session_scoped: true
  retrieval:
    stable_limit: 5
    episodic_limit: 5
    working_include_all: true
    min_similarity: 0.4
    dedup_threshold: 0.92

context_budget:
  response_reserve: 2000
  model_context_windows:
    gpt-4: 128000
    gpt-4o: 128000
    claude-sonnet: 200000
    claude-haiku: 200000
    llama3.2: 131072
    default: 8192
  sections:
    system_prompt:
      min: 500
      max: 2000
      target_pct: 0.10
      priority: 1              # Guaranteed — persona + constitutional layer
    conversation:
      min: 1000
      max: 8000
      target_pct: 0.25
      priority: 2              # Guaranteed — recent conversation history
    memory:
      min: 500
      max: 4000
      target_pct: 0.20
      priority: 3              # Tiered memory retrieval
    rag:
      min: 1000
      max: 6000
      target_pct: 0.30
      priority: 4              # RAG search results
    mental_models:
      min: 200
      max: 2000
      target_pct: 0.10
      priority: 5              # Active mental models
    entities:
      min: 100
      max: 1000
      target_pct: 0.05
      priority: 6              # Entity + pattern context
  relevance_weights:
    retrieval_similarity: 0.35
    recency: 0.25
    reference_frequency: 0.15
    domain_affinity: 0.15
    tier_weight: 0.10
  rolling:
    decay_per_turn: 0.85
    eviction_turns: 5
    amplification_reset: true

# RAG settings
rag:
  # Vector database
  vector_db_path: "./data/chroma_db"
  # Chunking
  chunk_size: 800
  chunk_overlap: 100
  # Retrieval
  n_results: 10  # Increased from 5 to 10 for better coverage
  # Reranking (when available)
  rerank: true

# Pattern learning
patterns:
  # Where to store learned patterns
  storage_path: "~/.apollo/patterns.json"
  # Minimum occurrences to consider a pattern
  min_occurrences: 3
  # Update frequency
  update_interval_hours: 24

# Mental models (Phase 14)
mental_models:
  # Where to store mental models
  storage_path: "~/.polly/mental_models.yaml"

# Personal knowledge graph
graph:
  storage_path: "~/.apollo/knowledge_graph.json"
  # Entity types to extract
  entity_types:
    - "concept"
    - "project"
    - "tool"
    - "pattern"
    - "person"
  # Auto-link based on co-occurrence
  auto_link_threshold: 0.7

# Learning tracker (Phase 22 - Teaching Mode)
learning:
  storage_path: "~/.polly/learning.json"
  spaced_repetition: true
  auto_suggest_review: true

# AI Features (Knowledge Writing & Progressive Autonomy)
ai_features:
  knowledge_suggestions:
    enabled: true
    style: "inline"         # "subtle" | "inline" | "ask_first"
    min_gap_score: 0.5      # 0.0-1.0 — only suggest when gap confidence exceeds this
  autonomy_dashboard:
    enabled: true
    show_in_status_bar: true

# Server settings
server:
  host: "0.0.0.0"
  port: 11436  # Different from Ollama (11434) and RAG (8000)
  # Enable for mobile access via Tailscale
  enable_remote: true

# CLI settings
cli:
  # Default output format: "text", "json", "markdown"
  output_format: "text"
  # History file
  history_path: "~/.apollo/history.json"
  # Max history entries
  max_history: 1000

# Logging
logging:
  level: "INFO"
  file: "~/.apollo/apollo.log"
  max_size_mb: 10
  backup_count: 3
